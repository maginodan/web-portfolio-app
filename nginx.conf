user www-data; 
worker_processes auto; 

events { 
    worker_connections 1024; 
} 

http { 
    include mime.types; 
    default_type application/octet-stream; 
    sendfile on; 

    # SPEED BOOST (compression) 
    gzip on; 
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml; 

    server { 
        listen 80; 
        server_name _; 
        root /app/public; 
        index index.php; 

        # Upload limit (important for portfolio media) 
        client_max_body_size 50M;

        # Laravel routing 
        location / { 
            try_files $uri $uri/ /index.php?$query_string; 
        } 

        # PHP handling (optimized) 
        location ~ \.php$ { 
            include fastcgi_params; 
            fastcgi_split_path_info ^(.+\.php)(/.+)$; 
            fastcgi_pass 127.0.0.1:9000; 
            fastcgi_index index.php; 
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 
        } 

        # Block hidden files 
        location ~ /\. { 
            deny all; 
        } 

        # 1. Images: Instant updates using the "Check but Don't Download" method 
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ { 
            add_header Cache-Control "no-cache, must-revalidate"; 
            etag on; 
            access_log off; 
        } 

        # 2. CSS and JS: Kept on 30-day cache for maximum site speed 
        location ~* \.(css|js)$ { 
            expires 30d; 
            access_log off; 
        } 
    } 
}
